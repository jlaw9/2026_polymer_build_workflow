name: nrel-polymers
channels:
    - conda-forge
dependencies:
    - python=3.11
    - pip
    - setuptools<81 # mbuild still imports pkg_resources, which setuptools removed in 81

    # Scientific libraries
    - numpy<=2.0.0
    - h5py
    - signac
    - signac-flow

    # Molecule building
    - mbuild
    - openbabel
    - packmol<=20.15.1 # DEVNOTE: have no idea why, but versions tested later than this release (at least 20.16.1 and 21.0.4) introduce PDB CONECT errors where there were previously none
    
    # Force field parameterization
    - openff-toolkit>=0.16
    - espaloma_charge>=0.0.8

    # pip installs
    - pip:
      - polymerist[chemdb,interactive]==1.0.1